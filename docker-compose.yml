services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medflow}
      POSTGRES_USER: ${POSTGRES_USER:-medflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medflow}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medflow} -d ${POSTGRES_DB:-medflow}"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      MEDFLOW_MODEL_CHECKPOINT: /app/models/resnet18.pth
      POSTGRES_DB: ${POSTGRES_DB:-medflow}
      POSTGRES_USER: ${POSTGRES_USER:-medflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medflow}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MEDFLOW_PERSIST_PREDICTIONS: ${MEDFLOW_PERSIST_PREDICTIONS:-false}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: .
    command: ["streamlit", "run", "src/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    environment:
      MEDFLOW_MODEL_CHECKPOINT: /app/models/resnet18.pth
      POSTGRES_DB: ${POSTGRES_DB:-medflow}
      POSTGRES_USER: ${POSTGRES_USER:-medflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medflow}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MEDFLOW_PERSIST_PREDICTIONS: ${MEDFLOW_PERSIST_PREDICTIONS:-false}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
